<!doctype html>
<!--
  Link-preview image (Open Graph) shown when the site is shared on Discord, Slack, LinkedIn, X…
  Output: assets/brand/og-image.png (1200×630). Re-render after editing, from the repo root:

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=8000 --screenshot="%CD%\assets\brand\og-image.png" "%CD%\source-media\og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@400;700&display=block">
<style>
  /* Same values as src/css/tokens.css */
  :root {
    --color-bg: #313131;
    --color-surface: #4d4d4d;
    --color-accent: #7bd565;
    --color-text: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--color-bg);
  }

  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    color: var(--color-text);
  }

  /* Project shots, tilted and bleeding off the right edge */
  .collage {
    position: absolute;
    top: -120px;
    right: -200px;
    width: 780px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    transform: rotate(-8deg);
  }

  .collage img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  }

  /* Fades the collage out behind the text */
  .fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      var(--color-bg) 0%,
      var(--color-bg) 45%,
      rgba(49, 49, 49, 0.88) 56%,
      rgba(49, 49, 49, 0) 75%);
  }

  .accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 12px;
    background: var(--color-accent);
  }

  .text {
    position: absolute;
    left: 76px;
    top: 0;
    bottom: 0;
    width: 680px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1 {
    margin: 0 0 22px;
    font-size: 112px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -3px;
    color: var(--color-accent);
  }

  /* The typewriter caret from the site header */
  .caret {
    display: inline-block;
    width: 0.4em;
    height: 0.8em;
    margin-left: 12px;
    vertical-align: -0.04em;
    background: var(--color-accent);
  }

  .role {
    font-size: 34px;
    font-weight: 600;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 30px;
  }

  .chip {
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--color-surface);
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="collage">
    <img src="../assets/video/thumbs/labyrinth_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/the_devils_diner_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/oddFarm_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/rogue_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/shaders_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/futurescape_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/unstable_star_thumbnail.jpg" alt="">
    <img src="../assets/video/thumbs/labyrinth_thumbnail.jpg" alt="">
  </div>
  <div class="fade"></div>
  <div class="accent-bar"></div>

  <div class="text">
    <h1>Ryan<br>Carpenter<span class="caret"></span></h1>
    <p class="role">Gameplay Programmer &amp; Technical Artist</p>
    <div class="chips">
      <span class="chip">Procedural</span>
      <span class="chip">Multiplayer</span>
      <span class="chip">Combat Systems</span>
      <span class="chip">Shaders</span>
    </div>
  </div>
</body>
</html>
